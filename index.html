<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>محادثات حية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo" aria-hidden="true">
        <img src="./logo-white.png" alt=""> 
      </div>

      <span class="spacer"></span>
      <button class="chip chip-glass" id="refreshBtn">تحديث</button>
      <button class="chip chip-white" id="newBtn">+ محادثة جديدة</button>
    </header>

    <main class="layout">
      <!-- القائمة الجانبية -->
      <aside class="panel sidebar">
        <div class="lines" id="lines"></div>

        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="ابحث في المحادثات الحالية" aria-label="بحث">
        </div>

        <div class="filters" id="filters">
          <button class="chip is-active" data-filter="all">الكل</button>
          <button class="chip" data-filter="unread">غير مقروء</button>
          <button class="chip" data-filter="pinned">المثبتة</button>
        </div>

        <div class="list" id="list"></div>
      </aside>

      <!-- نافذة المحادثة -->
      <section class="panel chat" id="chat">
        <div class="empty" id="empty">اختر محادثة للبدء</div>
        <div class="chat-inner" id="chatInner" hidden>
          <div class="chat-head">
            <button class="back" id="backBtn" aria-label="رجوع للمحادثات">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </button>
            <div class="avatar" id="chatAvatar"></div>
            <div class="chat-title">
              <strong id="chatName"></strong>
              <small id="chatStatus"></small>
            </div>
            <button class="chip">تعيين لموظف</button>
            <button class="chip chip-solid">إغلاق المحادثة</button>
          </div>
          <div class="messages" id="messages"></div>
          <form class="composer" id="composer">
            <input id="msgInput" type="text" placeholder="اكتب رسالتك هنا..." autocomplete="off" aria-label="الرسالة">
            <button class="send" aria-label="إرسال">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>
  
  <!-- نافذة QR -->
  <div class="modal" id="qrModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
      <h2 id="qrTitle"></h2>
      <p class="modal-sub">افتح واتساب ← الأجهزة المرتبطة ← ربط جهاز، ثم امسح الكود</p>
      <div class="qr-box" id="qrBox"></div>
      <div class="qr-status" id="qrStatus"></div>
      <button class="chip chip-solid" id="qrClose">إغلاق</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
